name: Refresh Google reviews

# Pulls the practice's real Google reviews and commits them into index.html.
# The API key lives in repository Secrets and is only ever used here, on
# GitHub's runners — it is never shipped to a visitor's browser.

# Manual only. The site currently ships a CURATED set of real reviews from
# tools/reviews.json (rendered by tools/build-reviews.mjs). Running this
# workflow REPLACES that curated set with whatever 5 reviews the Google API
# happens to return, so it must never fire on a schedule and quietly
# overwrite the owner's chosen ones.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-reviews
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Only the API key is secret. The Place ID is public and is baked into
      # tools/fetch-reviews.mjs, so there is just one secret to configure.
      - name: Fetch reviews and rewrite index.html
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node tools/fetch-reviews.mjs

      - name: Commit if the reviews changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No change in reviews — nothing to commit."
          else
            git add index.html
            git commit -m "Refresh Google reviews [skip ci]"
            git push
          fi
